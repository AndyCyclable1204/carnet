<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Se connecter — Carnet</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="bandeau">
  <div class="enveloppe">
    <a class="marque" href="index.html">Car<span>net</span></a>
    <nav><a href="index.html#simulateurs">Simulateurs</a></nav>
  </div>
</header>

<main class="enveloppe" style="max-width:460px;padding:3rem 0">
  <h1 id="titre">Se connecter</h1>
  <p class="accroche" id="sousTitre" style="color:var(--encre-2);margin-top:0.75rem">Retrouvez votre tableau de bord.</p>

  <div class="panneau" style="margin-top:1.5rem">
    <label class="champ"><span>Adresse e-mail</span>
      <input type="email" id="email" autocomplete="email" placeholder="vous@exemple.fr"></label>
    <label class="champ"><span>Mot de passe</span>
      <input type="password" id="motdepasse" autocomplete="current-password" placeholder="8 caractères minimum"></label>
    <button class="bouton" id="valider" style="width:100%">Se connecter</button>
    <p id="message" style="margin:0.9rem 0 0"></p>
    <p style="margin:0.9rem 0 0"><small><a href="#" id="oubli">Mot de passe oublié ?</a></small></p>
  </div>

  <p style="margin-top:1.25rem"><small id="bascule"></small></p>
  <p><small>Vos données sont stockées chiffrées et ne sont lisibles que par votre compte. Aucun accès à vos comptes bancaires n'est demandé. <a href="legal.html">En savoir plus</a>.</small></p>
</main>

<script type="module">
import { sb, messageErreur, utilisateurCourant } from './supabase.js';

const params = new URLSearchParams(location.search);
const retour = params.get('retour') || 'app.html';
let mode = params.get('mode') === 'inscription' ? 'inscription' : 'connexion';

const $ = (id) => document.getElementById(id);
const msg = $('message');

function affiche(texte, type = 'alerte') {
  msg.innerHTML = texte ? `<span class="avis ${type === 'ok' ? '' : 'alerte'}" style="display:block">${texte}</span>` : '';
}

function rendu() {
  const inscription = mode === 'inscription';
  $('titre').textContent = inscription ? 'Créer un compte' : 'Se connecter';
  $('sousTitre').textContent = inscription
    ? 'Un e-mail, un mot de passe, et votre tableau de bord est à vous.'
    : 'Retrouvez votre tableau de bord.';
  $('valider').textContent = inscription ? 'Créer mon compte' : 'Se connecter';
  $('motdepasse').autocomplete = inscription ? 'new-password' : 'current-password';
  $('bascule').innerHTML = inscription
    ? 'Vous avez déjà un compte ? <a href="#" id="lienBascule">Se connecter</a>'
    : 'Pas encore de compte ? <a href="#" id="lienBascule">En créer un</a>';
  document.getElementById('lienBascule').onclick = (e) => {
    e.preventDefault();
    mode = inscription ? 'connexion' : 'inscription';
    affiche('');
    rendu();
  };
}

$('valider').addEventListener('click', async () => {
  const email = $('email').value.trim();
  const motdepasse = $('motdepasse').value;
  if (!email || !motdepasse) return affiche('Renseignez votre adresse e-mail et votre mot de passe.');
  if (mode === 'inscription' && motdepasse.length < 8) return affiche('Le mot de passe doit faire au moins 8 caractères.');

  $('valider').disabled = true;
  affiche('');
  try {
    if (mode === 'inscription') {
      const { data, error } = await sb.auth.signUp({
        email,
        password: motdepasse,
        options: { emailRedirectTo: location.origin + '/app.html' },
      });
      if (error) throw error;
      if (data.session) location.href = retour;
      else affiche('Compte créé. Ouvrez le lien de confirmation envoyé à ' + email + ' pour activer votre tableau de bord.', 'ok');
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: motdepasse });
      if (error) throw error;
      location.href = retour;
    }
  } catch (e) {
    affiche(messageErreur(e));
  } finally {
    $('valider').disabled = false;
  }
});

$('motdepasse').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('valider').click(); });

$('oubli').addEventListener('click', async (e) => {
  e.preventDefault();
  const email = $('email').value.trim();
  if (!email) return affiche("Saisissez d'abord votre adresse e-mail, puis recliquez.");
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/auth.html' });
  affiche(error ? messageErreur(error) : 'Lien de réinitialisation envoyé à ' + email + '.', error ? 'alerte' : 'ok');
});

rendu();
utilisateurCourant().then((u) => { if (u) location.replace(retour); });
</script>
</body>
</html>
